8 characters, including spaces":`最多18个字符（含空格）`,"Enter patient name":`请输入患者姓名`,Gender:`性别`,Optional:`选填`,"Not specified":`未填写`,Male:`男`,Female:`女`,Age:`年龄`,"Patient for this treatment record":`本次治疗记录所属患者`,"Enter new patient details, or select an existing patient.":`填写新患者资料，或选择已有患者。`,"Change Patient":`更换患者`,"Select Patient":`选择患者`,"Patient Details":`患者资料`,"Update patient details on this device. Patient ID and treatment history will remain unchanged.":`更新设备中的患者资料，患者编号及历史治疗记录保持不变。`,"Save patient details to this device and select this patient. No treatment record will be created.":`将资料保存到设备并选中该患者，不生成治疗记录。`,"Treatment Summary":`治疗摘要`,"Output time":`输出时长`,"Phlebology 1":`静脉治疗 1`,Cancel:`取消`,"Discard Record":`放弃本次记录`,"Manage Records":`管理记录`,"Save Changes":`保存修改`,"Save and Select Patient":`保存并选择患者`,"Save Record":`保存记录`,"Patients with Matching Names":`同名患者`,"Verify the patient ID and details. A matching name does not confirm identity.":`请核对患者编号及资料，同名不代表同一患者。`,"Use This Patient ›":`选择此患者 ›`,"Back to Review":`返回核对`,Back:`返回`,"Use as New Patient":`登记为新患者`,Previous:`上一页`,"Page {0} of {1}":`第 {0} / {1} 页`,Next:`下一页`,Patients:`患者列表`,"USB Transfer":`USB 导入／导出`,"+ New Patient":`+ 新增患者`,"Search patients":`搜索患者`,"Search by name or patient ID":`按姓名或患者编号搜索`,"No patients found. Select New Patient to register a patient.":`未找到患者，可点击“新增患者”进行登记。`,Selected:`已选`,"Treatment Records ({0})":`治疗记录（{0}）`,"Select {0} {1}":`选择患者 {0} {1}`,"Delete patient {0} {1}":`删除患者 {0} {1}`,"Delete Patient":`删除患者`,"380 patients saved. Delete an unused patient to add another.":`已保存380位患者，请先删除不再需要的患者后再新增。`,Close:`关闭`,"Clear Patient Selection":`取消患者选择`,"Treatment Records":`治疗记录`,"TREATMENT RECORDS":`治疗记录`," · On {0} / Off {1} ms":` · 开启 {0} / 关闭 {1} ms`,"Delete Treatment Record":`删除治疗记录`,"No treatment records saved.":`暂无已保存的治疗记录。`,"Newest first · 5 records per page":`最新记录在前 · 每页5条`,"Delete Treatment Record?":`删除治疗记录？`,"Delete Patient?":`删除患者？`,"Delete this treatment record from the device? Other records and patient details will be retained.":`确认从设备删除此条治疗记录？其他记录及患者资料将保留。`,"Delete this patient and all {0} associated treatment records from the device?":`确认从设备删除该患者及其全部 {0} 条治疗记录？`,"This patient is selected for the current treatment. The unsaved treatment will be retained. Select or register a patient before saving it.":`该患者已被选为本次治疗患者。未保存的治疗摘要将保留，保存前需重新选择或登记患者。`,"This is the selected patient. Deleting this patient will also clear the current patient selection.":`该患者当前已被选中，删除后将同时清除当前患者选择。`,"This action cannot be undone.":`此操作无法撤销。`,"Discard Treatment Record?":`放弃本次治疗记录？`,"CONFIRM DISCARD":`确认放弃`,"This treatment record will be discarded. Existing patient details and saved records will be retained. This action cannot be undone.":`将放弃本次未保存的治疗记录，已有患者资料及历史记录将保留。此操作无法撤销。`,"USB {0} connected":`USB {0} 已连接`,"No USB connected":`未连接 USB`,"{0} / 380 patients · {1} treatment records":`{0} / 380 位患者 · {1} 条治疗记录`,"Export to USB":`导出至 USB`,"Export all saved patients and treatment records, then clear device storage.":`导出全部已保存的患者资料和治疗记录，成功后清空设备档案。`,"Import from USB":`从 USB 导入`,"Save or discard the current treatment before importing.":`请先保存或放弃本次治疗记录，再导入备份。`,"Replace all device records with a USB backup.":`使用 USB 备份替换设备中的全部患者档案。`,"Insert a USB drive to transfer records. Device storage remains available.":`请插入 USB 存储设备进行传输，设备内的资料仍可使用。`,"No patient backup on this USB drive.":`此 USB 中暂无患者备份。`,"USB archive version not supported.":`不支持此 USB 档案版本。`,"USB backup: {0} patients · {1} treatment records":`USB 备份：{0} 位患者 · {1} 条治疗记录`,"The current unsaved treatment is not included in the backup.":`备份不包含本次尚未保存的治疗记录。`,"USB backups do not update automatically.":`USB 备份不会自动更新。`,"Replace Device Records?":`替换设备档案？`,"Export Patient Backup?":`导出患者备份？`,"Replace all {0} patients and {1} treatment records on this device with the backup on USB {2}?":`确认用 USB {2} 的备份替换设备中全部 {0} 位患者及 {1} 条治疗记录？`,"Backup: {0} patients · {1} treatment records.":`备份内容：{0} 位患者 · {1} 条治疗记录。`,"Existing device records will be removed. Export them to another USB drive first if needed. This action cannot be undone.":`设备现有档案将被替换。如需保留，请先导出到另一块 USB。此操作无法撤销。`,"Export {0} patients and {1} saved treatment records to USB {2}?":`确认将 {0} 位患者及 {1} 条已保存的治疗记录导出至 USB {2}？`,"The existing patient backup on this USB drive will be replaced.":`此 USB 中的原有患者备份将被替换。`,"A patient backup will be created on this USB drive.":`将在此 USB 中创建患者备份。`,"Device records will be cleared.":`设备中的档案将被清除。`,"The current unsaved treatment is not included.":`不包含本次尚未保存的治疗记录。`,"Replace and Import":`替换并导入`,"Export and Clear Device":`导出并清空设备`,"Treatment record review":`治疗记录核对`,"Saved Successfully":`保存成功`,"Saved Successfully. Select to return to the main screen.":`保存成功，点击返回主界面。`,"Treatment record saved successfully.":`治疗记录已保存。`,"OPTION 3":`方案 3`,"Register before treatment · Review before saving":`术前可登记 · 保存前核对`,"Simulated device":`模拟设备`,"Device A · S2-A001":`设备 A · S2-A001`,"Device B · S2-B001":`设备 B · S2-B001`,"Device C · S2-C001":`设备 C · S2-C001`,"Simulated drive":`模拟 USB`,"No USB":`未插入 USB`,"Simulate USB write failure":`模拟 USB 写入失败`,"Simulate device storage failure":`模拟设备存储失败`,"Simulate newer USB format":`模拟不兼容的 USB 档案版本`,"Actual Size (1024 × 600)":`原始尺寸（1024 × 600）`,"Restart Demo Device":`重启模拟设备`,"Simulate interlock fault":`模拟联锁故障`,"Press and Hold Footswitch (Simulated)":`按住模拟脚踏进行输出`,"Demo Instructions":`演示说明`,"Full Screen":`全屏显示`,"Full screen is unavailable. Use your browser’s full-screen controls.":`无法进入全屏，请使用浏览器的全屏功能。`,"Devices A/B/C have separate simulated internal storage. USB A/B hold exported backups. Restart Demo Device retains saved data; reloading this webpage resets the simulation. No physical storage is accessed. Ankita · AR 0002 has 10 sample records for pagination.":`设备 A/B/C 各自独立保存模拟资料；USB A/B 存放导出的备份。重启模拟设备保留已保存数据，刷新网页会重置演示。不读写真实存储介质。Ankita · AR 0002 预置10条记录，可查看分页。`,"Hold the simulated footswitch to deliver output; release to pause. Select Standby to end the session.":`按住模拟脚踏进行输出，松开暂停；点击“待机”结束本次治疗。`,"Review the patient and treatment summary. Save or discard the record to continue.":`请核对患者及治疗摘要，保存或明确放弃本次记录后继续。`,"Treatment record saved to simulated device storage. Returning to the main screen.":`治疗记录已保存至模拟设备，正在返回主界面。`,"Select or register a patient, or select Ready to proceed without a patient.":`可选择或登记患者，也可直接点击“就绪”进入治疗。`,"Interface demonstration only. USB and footswitch inputs are simulated.":`仅用于界面演示，USB 与脚踏均为模拟输入。`,"Before treatment, register or select a patient. Alternatively, select Ready without selecting a patient.":`术前可登记或选择患者，也可不选患者直接点击“就绪”。`,"Hold the simulated footswitch to generate output. Select Standby to stop simulated output and return to the parameter screen. The review card then opens automatically.":`按住模拟脚踏产生输出。点击“待机”后停止输出并返回参数界面，随后自动显示核对卡。`,"Patient details and treatment records are saved on the simulated device, even with No USB selected. Limits: 380 patients, 10 records per patient and 18 characters per name, including spaces.":`患者资料和治疗记录保存在模拟设备中，无 USB 也可保存。上限为380位患者，每人10条记录，姓名最多18个字符（含空格）。`,"Open USB Transfer to export a backup. Switch to Device B or C, then import that backup. Import requires confirmation and replaces the destination device archive. Simply connecting a USB does not load its patients.":`通过“USB 导入／导出”导出备份，再切换至设备 B 或 C 导入。确认导入后整库替换目标设备资料，插入 USB 不会自动载入患者。`,"Open Treatment Records for Ankita · AR 0002 to see 10 sample records across two pages. Use Previous and Next; no swiping is required. Full storage blocks new records without deleting existing data.":`打开 Ankita · AR 0002 的治疗记录，用“上一页／下一页”查看两页共10条示例记录。无需滑动，容量满时阻止新增，不自动删除。`,"Simulate device storage failure tests saving and deleting on the device. Simulate USB write failure tests export retries. Simulate newer USB format tests unsupported backups without changing device records.":`可模拟设备存储失败以检查保存和删除重试，模拟 USB 写入失败以检查导出重试，或模拟档案版本不兼容；原资料将保留。`,"Actual Size displays the device at 1024 × 600 without scaling. Scroll below the device to reach the demo controls. Turn it off to fit the demonstration in a smaller window.":`“原始尺寸”按1024 ×
